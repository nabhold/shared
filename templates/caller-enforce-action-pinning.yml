# Copy into <repo>/.github/workflows/enforce-action-pinning.yml
# No adjustments usually needed — delete this comment block once copied.

name: Enforce Action Pinning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    # SHA is nabhold/shared's main HEAD, verified live via
    # `git ls-remote https://github.com/nabhold/shared.git main` on
    # 2026-08-24. NOT pinned to a `v1` tag: as of this writing
    # nabhold/shared has no tags at all, so `@v1` resolves to nothing.
    # Once a v1.0.0 release is cut, re-pin to that tag's commit.
    uses: nabhold/shared/.github/workflows/enforce-action-pinning.yml@1f1d7e321464761e766c6d6ea57174f6a9349072 # main HEAD — no v1 tag exists yet