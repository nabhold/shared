name: Security — Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of code changes — catches a secret that was
    # already committed before this check existed, or a scanner-rule
    # update from a new gitleaks version, without requiring a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
