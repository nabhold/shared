# ==============================================================================
# NABHOLD GROUP AFRICA
# Reusable — Foundation Repository Gates
#
# Target path: nabhold/shared/.github/workflows/foundation-repository-gates.yml
#
# Purpose
# -------
# workflow_call gate every repo's own .github/workflows/foundation.yml calls
# (see nabhold/baobab-dev's for the calling convention). Validates a
# repo's .nabhold/environment.yaml + .devcontainer/devcontainer.json against
# the Development Environment Contract, checks reproducibility inputs
# (lockfiles, SHA-pinned Actions, no floating base-image tags), and runs a
# Trivy dependency/secret/container scan.
#
# 2026-09-03: repository-contract job's PROFILE_BASELINES map updated —
# added "infra" (baobab-dev's new Terraform+AWS CLI profile) and fixed
# "frontend-e2e" (previously missing from the profile whitelist entirely,
# so frontend-e2e repos could never actually pass this job). See
# nabhold/shared's contracts/development-environment/schema.yaml for the
# profile definitions this file's PROFILE_BASELINES map mirrors.
#
# 2026-09-05: repository-contract job's minimum_version check fixed —
# it compared `minimum.start_with?(baseline[:minimum])`, a literal string
# prefix test, not a version floor. Any repo legitimately declaring a
# `minimum_version` newer than a baseline's exact string (e.g. "1.3.0"
# against the "full" profile's "1.2.6" floor) failed this job outright,
# even though nothing was actually incompatible — confirmed against
# nabhold/baobab-pulse, whose Foundation Repository Gates run has failed
# on every push since it legitimately moved to baobab-dev 1.3.0. Now a
# real Gem::Version `>=` comparison, so any release at or above a
# profile's floor passes, not only ones whose string happens to start
# with the floor's exact text.
# ==============================================================================

name: Reusable — Foundation Repository Gates

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile path; leave empty when the repository has no image.
        required: false
        type: string
        default: "Dockerfile"
      build_context:
        description: Docker build context used when dockerfile exists.
        required: false
        type: string
        default: "."
      dependency_review_enabled:
        description: Enable only after the repository dependency graph is enabled.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request' && inputs.dependency_review_enabled
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  repository-contract:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Codespaces and environment contract
        shell: ruby {0}
        run: |
          require "yaml"
          require "rubygems/version"

          declaration_path = ".nabhold/environment.yaml"
          devcontainer_path = ".devcontainer/devcontainer.json"
          abort "#{declaration_path} is required" unless File.file?(declaration_path)
          abort "#{devcontainer_path} is required" unless File.file?(devcontainer_path)

          declaration = YAML.safe_load_file(declaration_path, aliases: true)
          abort "invalid environment contract name" unless declaration.dig("schema", "name") == "nabhold-development-environment-contract"
          abort "unsupported environment contract version" unless declaration.dig("schema", "version").to_s == "1.0"
          abort "environment provider must be baobab-dev" unless declaration.dig("environment", "provider") == "baobab-dev"

          # Per-profile floor: the minimum baobab-dev version each profile must declare, and
          # the image tag baobab-dev publishes for it (mirrors nabhold/shared's own
          # contracts/development-environment/schema.yaml `profiles.*.image_tag_pattern`,
          # duplicated here because this job only checks out the *calling* repo, not
          # nabhold/shared itself, so it cannot read that file at runtime).
          #
          # Bumping an EXISTING profile's `minimum` here raises the floor for every repo
          # already on that profile and will break their CI until they bump their own
          # environment.yaml in step — do that deliberately, in its own PR, coordinated
          # with the repos on that profile, not as a drive-by edit alongside an unrelated
          # change. Adding a brand-new profile entry (as with "infra" below) is always
          # safe: by definition no existing repo declares it yet.
          PROFILE_BASELINES = {
            "full"         => { minimum: "1.2.6",      tag: ->(v) { "ghcr.io/nabhold/baobab-dev:#{v}" } },
            "frontend"     => { minimum: "1.2.6",      tag: ->(v) { "ghcr.io/nabhold/baobab-dev:#{v}-frontend" } },
            "frontend-e2e" => { minimum: "1.2.6",      tag: ->(v) { "ghcr.io/nabhold/baobab-dev:#{v}-frontend-e2e" } },
            "infra"        => { minimum: "1.4.0-rc.0", tag: ->(v) { "ghcr.io/nabhold/baobab-dev:#{v}-infra" } },
          }.freeze

          profile = declaration.dig("environment", "profile")
          abort "profile must be one of: #{PROFILE_BASELINES.keys.join(', ')}" unless PROFILE_BASELINES.key?(profile)

          baseline = PROFILE_BASELINES.fetch(profile)
          minimum = declaration.dig("environment", "minimum_version").to_s
          abort "profile '#{profile}' declares an unparseable minimum_version: #{minimum.inspect}" unless Gem::Version.correct?(minimum)
          abort "profile '#{profile}' requires baobab-dev >= v#{baseline[:minimum]}, got v#{minimum}" unless Gem::Version.new(minimum) >= Gem::Version.new(baseline[:minimum])

          expected = baseline[:tag].call(minimum)
          devcontainer = Dir.glob(".devcontainer/**/*").select { |path| File.file?(path) }.map { |path| File.read(path) }.join("\n")
          abort "devcontainer must use #{expected}" unless devcontainer.include?(expected)

          policy = declaration.fetch("compatibility_policy")
          %w[strict_runtime_versions allow_newer_patch_versions allow_newer_minor_versions allow_older_versions].each do |field|
            abort "compatibility_policy.#{field} must be boolean" unless [true, false].include?(policy[field])
          end

          capabilities = declaration.dig("validation", "required_capabilities")
          abort "required_capabilities must not be empty" unless capabilities.is_a?(Array) && !capabilities.empty?

      - name: Enforce reproducibility inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            [[ -f pnpm-lock.yaml || -f package-lock.json || -f yarn.lock ]] || {
              echo "::error::Node repositories require a committed lockfile"; exit 1;
            }
          fi
          if [[ -f go.mod ]]; then
            [[ -f go.sum ]] || { echo "::error::Go repositories require go.sum"; exit 1; }
          fi
          if [[ -f Dockerfile ]] && grep -Eq '^FROM[[:space:]]+[^[:space:]]+:(latest|edge)([[:space:]]|$)' Dockerfile; then
            echo "::error::Dockerfile base images must use explicit release versions"; exit 1
          fi
          violations=0
          while IFS= read -r line; do
            reference=$(sed -E 's/.*uses:[[:space:]]*//' <<< "$line" | awk '{print $1}')
            [[ "$reference" == ./* || "$reference" =~ @[0-9a-f]{40}$ ]] || {
              echo "::error::Action is not pinned to a full commit SHA: $reference"; violations=$((violations + 1));
            }
          done < <(find .github -type f \( -name '*.yml' -o -name '*.yaml' \) -exec grep -hE '^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*' {} + 2>/dev/null || true)
          (( violations == 0 ))

  vulnerability-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-verified Trivy
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$asset" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Scan repository dependencies and secrets
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-version-check .
      - name: Detect container build
        id: container
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          if [[ -n "$DOCKERFILE" && -f "$DOCKERFILE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build container for scanning
        if: steps.container.outputs.enabled == 'true'
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_CONTEXT: ${{ inputs.build_context }}
        run: docker build --file "$DOCKERFILE" --tag foundation-scan:${{ github.sha }} "$BUILD_CONTEXT"
      - name: Scan built container
        if: steps.container.outputs.enabled == 'true'
        run: trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --skip-version-check foundation-scan:${{ github.sha }}