asyncapi: 3.1.0
info:
  title: Nabhold control-plane events
  version: 1.0.0
  description: Versioned tenant lifecycle events published by baobab-cp.
defaultContentType: application/json
channels:
  tenantLifecycle:
    address: nabhold.control-plane.tenant.v1
    messages:
      provisioningStarted:
        $ref: "#/components/messages/ProvisioningStarted"
      provisioningStateChanged:
        $ref: "#/components/messages/ProvisioningStateChanged"
operations:
  publishTenantLifecycle:
    action: send
    channel:
      $ref: "#/channels/tenantLifecycle"
components:
  messages:
    ProvisioningStarted:
      name: com.nabhold.control-plane.tenant.provisioning-started.v1
      payload:
        allOf:
          - $ref: ./event-envelope.schema.json
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                required: [operation_id, tenant_id, isolation_strategy, revision]
                properties:
                  operation_id: { type: string, format: uuid }
                  tenant_id: { $ref: ./domain.schema.json#/$defs/tenantId }
                  isolation_strategy: { type: string, enum: [schema_per_tenant, row_level_security] }
                  revision: { type: integer, minimum: 1 }
    ProvisioningStateChanged:
      name: com.nabhold.control-plane.tenant.provisioning-state-changed.v1
      payload:
        allOf:
          - $ref: ./event-envelope.schema.json
          - type: object
            properties:
              data:
                type: object
                additionalProperties: false
                required: [operation_id, tenant_id, previous_state, state, revision]
                properties:
                  operation_id: { type: string, format: uuid }
                  tenant_id: { $ref: ./domain.schema.json#/$defs/tenantId }
                  previous_state: { type: string }
                  state: { type: string }
                  revision: { type: integer, minimum: 1 }
                  failure_code: { type: [string, "null"] }
