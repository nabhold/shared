openapi: 3.1.0
info:
  title: Nabhold Baobab Control Plane API
  version: 1.1.0
  description: Contract for tenant lifecycle management. Implementations live in nabhold/baobab-cp.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://control.nabhold.com/v1
    description: Production placeholder; activation requires an approved domain binding.
paths:
  /tenants:
    post:
      security:
        - adminOidc: [tenant:write]
      operationId: registerTenant
      summary: Register a tenant and start an idempotent provisioning operation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./tenant-registration.schema.json
      responses:
        "202":
          description: Registration accepted or an existing idempotent result returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisioningOperation"
              examples:
                controlPlaneMintedTenant:
                  summary: The Control Plane returns the tenant identity it minted
                  value:
                    operation_id: bb5e2e28-51e8-476b-b9cc-d4e94ced3d3d
                    tenant_id: tn_01k4m7x9q2v6c8r3d5f1h0j4
                    state: accepted
                    revision: 1
                    created_at: "2026-08-31T12:00:00Z"
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Insufficient authority }
        "409": { description: Identifier conflict or incompatible idempotent replay }
  /context/resolve:
    post:
      operationId: resolveTenantContext
      summary: Resolve authoritative tenant and product-entitlement context from the authenticated principal
      security:
        - workloadOidc: [context:resolve]
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./context-resolution.schema.json#/$defs/request
      responses:
        "200":
          description: Active, entitled tenant context
          headers:
            Cache-Control:
              schema: { type: string, const: "private, max-age=15" }
          content:
            application/json:
              schema:
                $ref: ./context-resolution.schema.json#/$defs/response
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Unresolved tenant or insufficient entitlement }
        "409": { description: Tenant lifecycle does not permit access }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: { type: string, format: uuid }
  schemas:
    ProvisioningOperation:
      type: object
      additionalProperties: false
      required: [operation_id, tenant_id, state, revision, created_at]
      properties:
        operation_id: { type: string, format: uuid }
        tenant_id: { $ref: ./domain.schema.json#/$defs/tenantId }
        state:
          type: string
          enum: [requested, accepted, provisioning, reconciling, active, suspended, failed, decommissioning, cancelled]
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        failure_code: { type: [string, "null"] }
  securitySchemes:
    adminOidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.nabhold.com/.well-known/openid-configuration
      description: Human administrator identity; issuer is environment-configured by the implementation.
    workloadOidc:
      type: openIdConnect
      openIdConnectUrl: https://identity.nabhold.com/.well-known/openid-configuration
      description: Short-lived workload or delegated identity token used only over the infrastructure-owned mTLS path.
