asyncapi: 3.1.0
info:
  title: Nabhold Baobab supplier-onboarding events
  version: 1.0.0
  description: >
    Estate-owned supplier intake and qualification events using the canonical
    Baobab event envelope. No message broker exists yet anywhere in this
    ecosystem to carry these (same position as contracts/erp/v1 today) — this
    contract exists so producers and future consumers have a stable shape to
    build against once one does.
defaultContentType: application/json
channels:
  supplierOnboardingEvents:
    address: nabhold.supplier-onboarding.events.v1
    messages:
      supplierApplicationSubmitted: { $ref: "#/components/messages/SupplierApplicationSubmitted" }
      supplierApplicationDecided: { $ref: "#/components/messages/SupplierApplicationDecided" }
      supplierQualificationUpdated: { $ref: "#/components/messages/SupplierQualificationUpdated" }
      supplierCapabilityVerified: { $ref: "#/components/messages/SupplierCapabilityVerified" }
operations:
  publishSupplierOnboardingEvents:
    action: send
    channel: { $ref: "#/channels/supplierOnboardingEvents" }
components:
  messages:
    SupplierApplicationSubmitted:
      name: com.nabhold.supplier-onboarding.application.submitted.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./supplier-application-submitted.schema.json }
    SupplierApplicationDecided:
      name: com.nabhold.supplier-onboarding.application.decided.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./supplier-application-decided.schema.json }
    SupplierQualificationUpdated:
      name: com.nabhold.supplier-onboarding.qualification.updated.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./supplier-qualification-updated.schema.json }
    SupplierCapabilityVerified:
      name: com.nabhold.supplier-onboarding.capability.verified.v1
      payload:
        allOf:
          - $ref: ../../events/v1/envelope.schema.json
          - type: object
            properties:
              data: { $ref: ./supplier-capability-verified.schema.json }
